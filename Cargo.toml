[package]
name = "altdb"
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "A paired, TLS-only Android debugging daemon for KernelSU"
build = "build.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = { version = "0.6", features = ["all"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
